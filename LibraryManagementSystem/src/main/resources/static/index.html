<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">LibrarySys</a>
            <div class="d-flex">
                <a href="admin-auth.html" class="btn btn-outline-secondary btn-sm">Admin Portal</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">

            <div class="col-md-5 mb-4" id="login-section">
                <div class="glass-card">
                    <h4 class="mb-4">Member Login</h4>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="login-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>
                    <div class="mt-3 text-center border-top pt-3">
                        <span class="text-muted">New here? </span>
                        <button type="button" class="btn btn-sm btn-outline-secondary ms-1"
                            onclick="toggleForms('register')">Create Account</button>
                    </div>
                </div>
            </div>

            <div class="col-md-5 mb-4 d-none" id="register-section">
                <div class="glass-card">
                    <h4 class="mb-4">Create Account</h4>
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="reg-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="reg-email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="reg-phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="reg-password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Sign Up</button>
                    </form>
                    <div class="mt-3 text-center border-top pt-3">
                        <span class="text-muted">Already have an account? </span>
                        <button type="button" class="btn btn-sm btn-outline-secondary ms-1"
                            onclick="toggleForms('login')">Sign In</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:11">
        <div id="liveToast" class="toast align-items-center p-0" role="alert">
            <div class="d-flex p-2">
                <div class="toast-body" id="toast-message"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            if (token && userStr) redirectBasedOnRole(JSON.parse(userStr).roles);
        });

        function toggleForms(target) {
            document.getElementById('login-section').classList.toggle('d-none', target === 'register');
            document.getElementById('register-section').classList.toggle('d-none', target === 'login');
        }
    </script>
</body>

</html>
