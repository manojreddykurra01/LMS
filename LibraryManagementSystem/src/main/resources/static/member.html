<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">LibrarySys <span class="badge bg-secondary ms-2">Member</span></a>
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-text" id="user-greeting"></span>
                <button class="btn btn-outline-secondary btn-sm" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <ul class="nav nav-tabs mb-0" id="memberTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#browse" type="button">Browse
                    Books</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#history" type="button"
                    onclick="loadHistory()">My History</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="browse">
                <div class="glass-card mt-0 rounded-top-0">
                    <div class="d-flex gap-2 mb-4">
                        <select class="form-select w-auto" id="search-type">
                            <option value="title">Title</option>
                            <option value="author">Author</option>
                            <option value="category">Category</option>
                        </select>
                        <input type="text" class="form-control" id="search-input" placeholder="Search...">
                        <button class="btn btn-primary" onclick="searchBooks()">Search</button>
                        <button class="btn btn-secondary"
                            onclick="document.getElementById('search-input').value=''; searchBooks()">All</button>
                    </div>
                    <div class="row" id="books-container"></div>
                </div>
            </div>

            <div class="tab-pane fade" id="history">
                <div class="glass-card mt-0 rounded-top-0">
                    <h5 class="mb-3">My Borrowing History</h5>
                    <div class="table-responsive">
                        <table class="table table-glass">
                            <thead>
                                <tr>
                                    <th>Book</th>
                                    <th>Borrow Date</th>
                                    <th>Return Date</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div class="modal fade" id="feedbackModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Leave Feedback</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="feedback-form">
                        <input type="hidden" id="feedback-book-id">
                        <div class="mb-3"><label class="form-label">Rating</label>
                            <select class="form-select" id="feedback-rating">
                                <option value="5">5 - Excellent</option>
                                <option value="4">4 - Good</option>
                                <option value="3">3 - Average</option>
                                <option value="2">2 - Poor</option>
                                <option value="1">1 - Terrible</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Comments</label>
                            <textarea class="form-control" id="feedback-comments" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Adjust Return Date Modal -->
    <div class="modal fade" id="adjustReturnModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adjust Return Date</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="adjust-date-form">
                        <input type="hidden" id="adjust-record-id">
                        <div class="mb-3">
                            <label class="form-label">New Return Date</label>
                            <input type="date" class="form-control" id="adjust-new-date" required>
                            <div class="form-text" id="adjust-date-hint"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirm</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1055">
        <div id="liveToast" class="toast align-items-center p-0" role="alert">
            <div class="d-flex p-2">
                <div class="toast-body" id="toast-message"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            if (!userStr) { logout(); return; }
            currentUser = JSON.parse(userStr);
            document.getElementById('user-greeting').textContent = 'Hi, ' + currentUser.username;
            document.getElementById('logout-btn').addEventListener('click', logout);
            searchBooks();

            document.getElementById('feedback-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const bookId = document.getElementById('feedback-book-id').value;
                const rating = parseInt(document.getElementById('feedback-rating').value);
                const comments = document.getElementById('feedback-comments').value;
                try {
                    await apiCall('/feedbacks?userId=' + currentUser.id + '&bookId=' + bookId, 'POST', { rating, comments });
                    showToast('Feedback submitted!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('feedbackModal')).hide();
                } catch (e) { }
            });

            document.getElementById('adjust-date-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await adjustReturnDate(
                    document.getElementById('adjust-record-id').value,
                    document.getElementById('adjust-new-date').value
                );
            });

            document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') searchBooks(); });
        });

        async function searchBooks() {
            const term = document.getElementById('search-input').value.trim();
            const type = document.getElementById('search-type').value;
            const url = term ? '/books/search?' + type + '=' + encodeURIComponent(term) : '/books';
            try {
                const books = await apiCall(url);
                const container = document.getElementById('books-container');
                container.innerHTML = '';
                if (!books.length) { container.innerHTML = '<p class="text-muted">No books found.</p>'; return; }
                books.forEach(b => {
                    const isAvail = b.availableCopies > 0;
                    const col = document.createElement('div');
                    col.className = 'col-md-4 mb-3';
                    col.innerHTML = `
                        <div class="glass-card h-100">
                            <h6 class="mb-1">${b.title}</h6>
                            <p class="text-muted small mb-2">By ${b.author} &middot; ${b.category}</p>
                            <span class="badge ${isAvail ? 'bg-success' : 'bg-warning text-dark'} mb-3">
                                ${isAvail ? b.availableCopies + ' Available' : 'Not Available'}
                            </span><br>
                            ${isAvail
                            ? `<button class="btn btn-primary btn-sm" onclick="borrowBook(${b.id})">Borrow</button>`
                            : `<button class="btn btn-secondary btn-sm" onclick="reserveBook(${b.id})">Reserve</button>`
                        }
                        </div>`;
                    container.appendChild(col);
                });
            } catch (e) { }
        }

        async function borrowBook(bookId) {
            try { await apiCall('/borrowings/borrow?userId=' + currentUser.id + '&bookId=' + bookId, 'POST'); showToast('Borrowed!', 'success'); searchBooks(); } catch (e) { }
        }

        async function reserveBook(bookId) {
            try { await apiCall('/reservations/reserve?userId=' + currentUser.id + '&bookId=' + bookId, 'POST'); showToast('Reserved!', 'success'); } catch (e) { }
        }

        async function loadHistory() {
            try {
                const history = await apiCall('/borrowings/history/user/' + currentUser.id);
                const tbody = document.getElementById('history-table-body');
                tbody.innerHTML = '';
                if (!history.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No history yet.</td></tr>'; return; }
                history.forEach(r => {
                    let btn = r.status === 'BORROWED'
                        ? `<button class="btn btn-sm btn-secondary me-1" onclick="returnBook(${r.id})">Return</button>
                           <button class="btn btn-sm btn-secondary" onclick='openAdjustModal(${r.id},"${r.borrowDate}","${r.expectedReturnDate}")'>Adjust Date</button>`
                        : `<button class="btn btn-sm btn-secondary" onclick="openFeedbackModal(${r.book.id})">Feedback</button>`;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${r.book.title}</td><td>${r.borrowDate}</td><td>${r.expectedReturnDate}</td>
                    <td><span class="badge ${r.status === 'BORROWED' ? 'bg-primary' : 'bg-secondary'}">${r.status}</span></td>
                    <td>${btn}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (e) { }
        }

        async function returnBook(id) {
            if (confirm('Return this book?')) {
                try { await apiCall('/borrowings/return/' + id, 'POST'); showToast('Returned!', 'success'); loadHistory(); } catch (e) { }
            }
        }

        function openFeedbackModal(bookId) {
            document.getElementById('feedback-book-id').value = bookId;
            document.getElementById('feedback-comments').value = '';
            document.getElementById('feedback-rating').value = '5';
            new bootstrap.Modal(document.getElementById('feedbackModal')).show();
        }

        function openAdjustModal(recordId, borrowDate, currentReturnDate) {
            document.getElementById('adjust-record-id').value = recordId;
            const dateInput = document.getElementById('adjust-new-date');
            const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
            dateInput.min = tomorrow.toISOString().split('T')[0];
            const borrow = new Date(borrowDate);
            const maxDate = new Date(borrow); maxDate.setDate(borrow.getDate() + 30);
            dateInput.max = maxDate.toISOString().split('T')[0];
            dateInput.value = currentReturnDate;
            document.getElementById('adjust-date-hint').textContent = 'Max date: ' + maxDate.toDateString() + ' (30 days from borrow)';
            new bootstrap.Modal(document.getElementById('adjustReturnModal')).show();
        }

        async function adjustReturnDate(recordId, newDate) {
            try {
                await apiCall('/borrowings/' + recordId + '/adjust-return-date?newReturnDate=' + newDate, 'PATCH');
                showToast('Return date updated!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('adjustReturnModal')).hide();
                loadHistory();
            } catch (e) { }
        }
    </script>
</body>

</html>
